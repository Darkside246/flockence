# Include inside the Chicken Op HTTPS server block.
# Legacy Farm Vision evidence was once stored under public/uploads/vision.
# Keep it blocked throughout migration and permanently after legacy cleanup.
location ^~ /uploads/vision/ {
    return 404;
}

# Private media is served only through the authenticated Next.js media endpoint.
# Never expose the storage volume as an Nginx alias or static directory.
location ^~ /storage/vision/ {
    return 404;
}
